[project]
name = "leaf"
version = "0.1.0"
description = "Leaf: a plant-doctor agent on NVIDIA Nemotron via Nebius Token Factory"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "httpx>=0.27",
  "tavily-python>=0.7",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "pillow>=10.4",
  "boto3>=1.34",  # journal in S3-compatible Object Storage (LEAF_JOURNAL_BUCKET)
  "tzdata>=2024.1",  # time zones for gardens, also on slim images without system tzdata
  "pywebpush>=2.5",  # Web Push (VAPID) notifications; MPL-2.0
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.data" = ["migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --no-header -rf"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # code blocks in docs are laid out by hand

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
