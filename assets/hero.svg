<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">Leaf</title>
  <desc id="d">Leaf: your garden's plan for today, this season, and the day a plant gets sick. A vine grows and leaves drift across a green banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e19"/>
      <stop offset="0.55" stop-color="#14562d"/>
      <stop offset="1" stop-color="#1e7a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#d3f2b5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d3f2b5" stop-opacity="0"/>
    </radialGradient>
    <path id="leaf" d="M0 0 C 16 -24, 54 -24, 74 0 C 54 24, 16 24, 0 0 Z"/>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8ea60"/><stop offset=".55" stop-color="#4fbd5a"/><stop offset="1" stop-color="#0e8a45"/></linearGradient>
    <path id="rib" d="M4 0 L 66 0" fill="none"/>
    <clipPath id="round"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>
  <style>
    .t1 { font: italic 600 124px Georgia, 'Times New Roman', serif; fill: #f4fbe9; letter-spacing: -2px; }
    .t2 { font: 400 27px Georgia, 'Times New Roman', serif; fill: #d9f2c4; }
    .pill rect { fill: rgba(244,251,233,.12); stroke: rgba(244,251,233,.45); stroke-width: 1.2; }
    .pill text { font: 600 17px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f4fbe9; }
    .in  { opacity: 0; animation: rise 14s ease-out infinite; transform-box: fill-box; }
    @keyframes rise {
      0%   { opacity: 0; transform: translateY(18px); }
      6%   { opacity: 1; transform: translateY(0); }
      92%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(0); }
    }
    .stem { fill: none; stroke: #8be0a0; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 640; stroke-dashoffset: 640; animation: grow 14s ease-in-out infinite; }
    @keyframes grow {
      0%   { stroke-dashoffset: 640; opacity: 1; }
      26%  { stroke-dashoffset: 0; }
      90%  { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    .pop { transform-box: fill-box; transform-origin: 0% 50%; transform: scale(0); animation: pop 14s ease-out infinite; }
    @keyframes pop {
      0%   { transform: scale(0); opacity: 1; }
      6%   { transform: scale(0); }
      12%  { transform: scale(1.12); }
      15%  { transform: scale(1); }
      90%  { transform: scale(1); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .lf  { fill: #4fbf6c; }
    .lf2 { fill: #7ad98f; }
    .lf3 { fill: #a6e8a6; }
    .rb  { stroke: #0f4a25; stroke-width: 1.6; opacity: .55; }
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
    .drift { animation: drift 16s linear infinite; opacity: 0; }
    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8%   { opacity: .75; }
      92%  { opacity: .75; }
      100% { transform: translate(-340px, 330px) rotate(300deg); opacity: 0; }
    }
    .sun { animation: sun 9s ease-in-out infinite alternate; }
    @keyframes sun { from { opacity: .7; } to { opacity: 1; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect class="sun" width="1200" height="400" fill="url(#glow)"/>

    <!-- drifting leaves -->
    <g transform="translate(1180 -20)"><g class="drift" style="animation-delay:0s"><use href="#leaf" class="lf3" transform="scale(.5)"/></g></g>
    <g transform="translate(1030 -30)"><g class="drift" style="animation-delay:-5s"><use href="#leaf" class="lf2" transform="scale(.38)"/></g></g>
    <g transform="translate(860 -40)"><g class="drift" style="animation-delay:-9s"><use href="#leaf" class="lf3" transform="scale(.45)"/></g></g>
    <g transform="translate(1120 -10)"><g class="drift" style="animation-delay:-12s"><use href="#leaf" class="lf2" transform="scale(.32)"/></g></g>

    <!-- vine -->
    <g class="sway">
      <path class="stem" d="M985 420 C 985 360, 930 330, 960 270 S 1040 200, 1000 130 S 1050 50, 1040 -10"/>
      <g transform="translate(975 340) rotate(-28)"><g class="pop" style="animation-delay:.9s"><use href="#leaf" class="lf"/><use href="#rib" class="rb" stroke="#0f4a25"/></g></g>
      <g transform="translate(978 330) rotate(-155)"><g class="pop" style="animation-delay:1.1s"><use href="#leaf" class="lf2" transform="scale(.8)"/></g></g>
      <g transform="translate(955 272) rotate(-160)"><g class="pop" style="animation-delay:1.5s"><use href="#leaf" class="lf" transform="scale(.95)"/><use href="#rib" class="rb" transform="scale(.95)"/></g></g>
      <g transform="translate(962 262) rotate(-15)"><g class="pop" style="animation-delay:1.7s"><use href="#leaf" class="lf3" transform="scale(1.05)"/><use href="#rib" class="rb" transform="scale(1.05)"/></g></g>
      <g transform="translate(1018 190) rotate(-32)"><g class="pop" style="animation-delay:2.1s"><use href="#leaf" class="lf2" transform="scale(.9)"/></g></g>
      <g transform="translate(1004 168) rotate(-165)"><g class="pop" style="animation-delay:2.3s"><use href="#leaf" class="lf" transform="scale(1)"/><use href="#rib" class="rb"/></g></g>
      <g transform="translate(1010 118) rotate(-24)"><g class="pop" style="animation-delay:2.7s"><use href="#leaf" class="lf3" transform="scale(.85)"/></g></g>
      <g transform="translate(1040 66) rotate(-150)"><g class="pop" style="animation-delay:3s"><use href="#leaf" class="lf2" transform="scale(.8)"/></g></g>
    </g>

    <!-- text -->
        <g transform="translate(38 22) scale(.86)"><g class="in" style="animation-delay:.1s">
      <path d="M60 160 C61 172 58 182 54 195" fill="none" stroke="#1b9a4c" stroke-width="6" stroke-linecap="round"/>
      <path d="M60 8 C76 22 97 48 97 80 C97 118 80 148 60 163 C40 148 23 118 23 80 C23 48 44 22 60 8 Z" fill="url(#lg)"/>
    </g></g>
    <g class="in" style="animation-delay:.2s"><text class="t1" x="150" y="158">Leaf</text></g>
    <g class="in" style="animation-delay:.7s">
      <text class="t2" x="76" y="250">What your garden needs today,</text>
      <text class="t2" x="76" y="286">the plan for the whole season,</text>
      <text class="t2" x="76" y="322">and what's wrong when a plant gets sick.</text>
    </g>
    <g class="in pill" style="animation-delay:1.3s"><rect x="76" y="348" width="86" height="34" rx="17"/><text x="119" y="370" text-anchor="middle">Today</text></g>
    <g class="in pill" style="animation-delay:1.45s"><rect x="172" y="348" width="124" height="34" rx="17"/><text x="234" y="370" text-anchor="middle">Season plan</text></g>
    <g class="in pill" style="animation-delay:1.6s"><rect x="306" y="348" width="100" height="34" rx="17"/><text x="356" y="370" text-anchor="middle">Diagnose</text></g>
    <g class="in pill" style="animation-delay:1.75s"><rect x="416" y="348" width="80" height="34" rx="17"/><text x="456" y="370" text-anchor="middle">Radar</text></g>
    <g class="in pill" style="animation-delay:1.9s"><rect x="506" y="348" width="96" height="34" rx="17"/><text x="554" y="370" text-anchor="middle">Connect</text></g>
  </g>
</svg>
