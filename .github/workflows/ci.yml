name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . --output-format concise
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix cloudflare --no-fund --no-audit
      - run: npx --prefix cloudflare tsc --noEmit -p cloudflare
